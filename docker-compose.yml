version: "3.8"

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clawhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go API server + Admin UI
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18080:18080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=clawhost
      - SERVER_PORT=18080
      - KUBERNETES_LOCAL_DEV=false
      # Set your domains
      - DOMAIN_API_DOMAIN=admin.cookieclicker.ai
      - DOMAIN_BOT_DOMAIN=cookieclicker.ai
      # Admin token for API access
      - API_ADMIN_TOKEN=change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config.toml:/app/config.toml:ro

  # Portal frontend (Next.js)
  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - CLAWHOST_API_URL=http://server:18080
      # For production, use your API domain:
      # - CLAWHOST_API_URL=https://admin.cookieclicker.ai
    depends_on:
      - server

volumes:
  postgres_data: