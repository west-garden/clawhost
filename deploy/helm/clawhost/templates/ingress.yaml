{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "clawhost.fullname" . }}
  labels:
    {{- include "clawhost.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    # API domain: /admin/*, /api/*, /auth/*
    - host: {{ .Values.domain.apiDomain | quote }}
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "clawhost.fullname" . }}
                port:
                  number: {{ .Values.server.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "clawhost.fullname" . }}
                port:
                  number: {{ .Values.server.port }}
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "clawhost.fullname" . }}
                port:
                  number: {{ .Values.server.port }}
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "clawhost.fullname" . }}
                port:
                  number: {{ .Values.server.port }}
    {{- if .Values.portal.enabled }}
    # Portal domain
    - host: {{ .Values.domain.botDomain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "clawhost.fullname" . }}-portal
                port:
                  number: {{ .Values.portal.port }}
    {{- end }}
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "clawhost.fullname" $ }}
                port:
                  number: {{ $.Values.server.port }}
          {{- end }}
    {{- end }}
{{- end }}