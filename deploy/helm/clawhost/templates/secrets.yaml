apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clawhost.fullname" . }}
  labels:
    {{- include "clawhost.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ .Values.adminToken | quote }}
  db-password: {{ include "clawhost.dbPassword" . | quote }}
  {{- if .Values.initialAdmin.email }}
  initial-admin-email: {{ .Values.initialAdmin.email | quote }}
  initial-admin-password: {{ .Values.initialAdmin.password | quote }}
  initial-admin-name: {{ .Values.initialAdmin.name | default .Values.initialAdmin.email | quote }}
  {{- end }}
